# Metadata that drives ingestion. Add an entry to onboard a new slice of data — no code changes.
#
# Two grains, on purpose:
#   contracts     one row per award: who, what, total lifetime value (award dimension)
#   transactions  one row per obligation (base award or modification) with its own date:
#                 this is the money actually committed, so all "spend over time" uses it
# Scope: which agencies to analyze. Keeps volume manageable and the analysis focused.
# Remove the `filters:` line from a source to pull every agency.
scope: &scope
  agencies:
    - {type: awarding, tier: toptier, name: "National Aeronautics and Space Administration"}
    - {type: awarding, tier: toptier, name: "General Services Administration"}
    - {type: awarding, tier: toptier, name: "Environmental Protection Agency"}

sources:
  - name: contracts
    active: true
    endpoint: /api/v2/search/spending_by_award/
    award_type_codes: ["A", "B", "C", "D"]   # definitive contracts, POs, delivery orders, BPA calls
    date_type: action_date                     # awards with any action in the window
    sort: Award Amount
    page_size: 100
    filters: *scope
    dedup_keys: [generated_internal_id]
    fields:
      - Award ID
      - generated_internal_id
      - Recipient Name
      - Recipient UEI
      - Awarding Agency
      - Awarding Sub Agency
      - Funding Agency
      - Award Amount
      - Total Outlays
      - Contract Award Type
      - NAICS
      - PSC
      - Description
      - Start Date
      - End Date
      - Last Modified Date
      - Place of Performance State Code

  - name: transactions
    active: true
    endpoint: /api/v2/search/spending_by_transaction/
    award_type_codes: ["A", "B", "C", "D"]
    sort: Transaction Amount
    page_size: 100
    filters: *scope
    dedup_keys: [generated_internal_id, Mod]
    fields:
      - Award ID
      - Mod
      - Recipient Name
      - Recipient UEI
      - Action Date
      - Transaction Amount
      - Transaction Description
      - Awarding Agency
      - Awarding Sub Agency
      - Award Type
      - NAICS
      - PSC

landing:
  # Local folder for runs on your laptop; Unity Catalog Volume path for Databricks.
  local_dir: data/landing
  volume_dir: /Volumes/procurement/raw/landing

synthetic_landing:
  # Synthetic test data (python -m ingestion.synthetic) lands here, never mixed with real data.
  # Point the pipeline's landing_path at volume_dir to run it on synthetic data.
  local_dir: data/landing_synthetic
  volume_dir: /Volumes/procurement/raw/landing_synthetic
